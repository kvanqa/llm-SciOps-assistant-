# SKAO document Assistant config

mode: local_llm   #retrieval | local_llm | api_llm

chunking:
  chunk_size: 800       # characters per chunk
  chunk_overlap: 150

retrieval:
  top_k: 5 # chaning this to 5 for better retrieval
  embedding_backend: ollama   # auto | sentence_transformers | tfidf
  embedding_model: nomic-embed-text #all-MiniLM-L6-v2   # used if sentence_transformers available

# also want to add temperature = 0.1
local_llm:
  provider: ollama
  model: llama3.2
  host: http://localhost:11434
  temperature: 0.1

api_llm:
  # Left blank on purpose. Do not fill in until data governance has signed
  # off on sending document content to an external API.
  provider: null
  model: null
